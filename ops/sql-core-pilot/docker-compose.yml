services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aivcs
      POSTGRES_PASSWORD: aivcs-local
      POSTGRES_DB: aivcs
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivcs -d aivcs"]
      interval: 3s
      timeout: 5s
      retries: 20

  cockroach:
    image: cockroachdb/cockroach:v25.4.2
    command: start-single-node --insecure --http-addr=0.0.0.0:8080
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - cockroach-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "--host=localhost:26257", "-e", "SELECT 1"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  cockroach-data:
