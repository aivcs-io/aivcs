# The AIVCS content-addressed storage surface — the CAS/
# commit/branch/manifest HTTP contract that `aivcs fetch`/`publish`/`clone`
# require. Ported from the archived `aivcs.io/crates/aivcsd` (routes/repo.rs) +
# its `http_remote.rs` client contract, so the split in apps-middle-ware hosts
# the forge that the "convert aivcs.io code to aivcs, not git" goal depends on.

