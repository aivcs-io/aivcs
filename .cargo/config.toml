# Cargo configuration for aivcs.
#
# Sovereign Cargo registry — sparse index at registry.aivcs.io, auth via
# CARGO_REGISTRIES_AIVCS_TOKEN (ESO/GSM — never committed). Required because
# `oxidized-state` consumes `data-mesh-client` from the registry rather than
# from github.com; without this block the workspace does not parse at all:
#   registry index was not found in any configuration: `aivcs`
#
# Mirrors lornu-ai/apps-middle-ware, lornu-ai/agent-orchestrate-ai and
# lornu-ai/a2a-mcp.

[registries.aivcs]
index = "sparse+https://registry.aivcs.io/"
credential-provider = ["cargo:token"]

# NOTE: the default source registry is left as crates.io (unchanged). Do not add
# a `[source.crates-io] replace-with = "aivcs"` or a `[registry] default` line —
# that would reroute *all* resolution through the private registry.
